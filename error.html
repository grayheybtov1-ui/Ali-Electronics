<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Bloklanıb - Ali Electronics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0b1a30;
            --danger-color: #b91c1c;
            --font-family: 'Inter', sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, #0b1a30 0%, #162a45 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }
        .error-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 45px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        .error-icon {
            font-size: 4rem;
            color: #f87171;
            margin-bottom: 20px;
            animation: shake 0.5s ease-in-out infinite alternate;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .info-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #f87171;
            font-weight: 500;
        }
        @keyframes shake {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <i class="bx bxs-shield-x error-icon"></i>
        <h1>Giriş Bloklanıb!</h1>
        <p>Giriş kodu ardıcıl olaraq 3 dəfə yanlış daxil edildiyi üçün sistem təhlükəsizlik məqsədilə müvəqqəti olaraq bloklanmışdır.</p>
        <div class="info-box">
            Təhlükəsizlik Sistemi: Giriş Qadağandır.
        </div>
    </div>
</body>
</html>
